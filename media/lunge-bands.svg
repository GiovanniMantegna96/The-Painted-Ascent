<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 380" width="1000">
  <rect width="1700" height="380" fill="#F5EEE2"/>
  <defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C9923A"/></marker></defs>
  <rect x="120" y="150" width="300" height="80" fill="#9a8a8e" fill-opacity=".16"/>
  <rect x="420" y="150" width="880" height="80" fill="#C9923A" fill-opacity=".2"/>
  <rect x="1300" y="150" width="300" height="80" fill="#9a8a8e" fill-opacity=".08"/>
  <path d="M160 180 C 500 40, 900 40, 1175 175" stroke="#C9923A" stroke-width="7" fill="none" marker-end="url(#fl)"/>
  <circle cx="120" cy="190" r="32" fill="#F1E6D4" stroke="#B8203A" stroke-width="6"/>
  <circle cx="1250" cy="190" r="48" fill="#6B3F8A"/>
  <g font-family="Arial, sans-serif" font-size="30" text-anchor="middle">
    <text x="120" y="275" font-weight="700" fill="#B8203A">player</text>
    <text x="270" y="325" fill="#7a6a6e">under 120</text><text x="270" y="358" fill="#7a6a6e" font-size="26">normal step</text>
    <text x="860" y="325" font-weight="700" fill="#8a6220">120 – 400</text><text x="860" y="358" fill="#8a6220" font-size="26">the step stretches to the enemy</text>
